name: Update LeetCode PDF

on:
  push:
    paths-ignore:
      - 'LeetCode_Notes.pdf'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PDF and AI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install reportlab
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu

      - name: Analyze solutions with AI
        if: ${{ env.OPENAI_API_KEY != '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
        run: python ai_solution_analyzer.py

      - name: Generate PDF
        run: python generate_pdf.py

      - name: Commit updated PDF and AI analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LeetCode_Notes.pdf .ai/
          if git diff --cached --quiet; then
            echo "PDF is already up to date."
          else
            git commit -m "docs: update LeetCode PDF and AI analysis"
            git push
          fi
