name: Update LeetCode PDF

on:
  push:
    paths-ignore:
      - 'LeetCode_Notes.pdf'
      - '.ai/**'
  workflow_dispatch:

permissions:
  contents: write

# Prevent multiple PDF jobs from fighting over the same PDF commit.
concurrency:
  group: update-leetcode-pdf
  cancel-in-progress: false

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PDF dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install reportlab pygments
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu

      - name: Generate and push PDF
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # LeetHub can push a new solution while this workflow is running.
          # Always regenerate from the latest main before trying to push.
          for attempt in 1 2 3 4 5; do
            echo "PDF update attempt ${attempt}/5"

            git fetch origin main
            git reset --hard origin/main

            python generate_pdf.py
          python generate_pdf_simple.py

            git add LeetCode_Notes.pdf LeetCode_Notes_Simple.pdf
            if git diff --cached --quiet; then
              echo "PDF is already up to date."
              exit 0
            fi

            git commit -m "docs: update LeetCode PDF"

            if git push origin HEAD:main; then
              echo "PDF update pushed successfully."
              exit 0
            fi

            echo "Main changed while pushing. Re-fetching and regenerating the PDF..."
            sleep $((attempt * 2))
          done

          echo "Unable to push PDF update after 5 attempts."
          exit 1
